# BACKGROUND
background {
    monitor =
    path = ~/wallpapers/striking-water.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}
# GENERAL
general {
    ignore_empty_input = true
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on
}

animation {

}


# CONTAINER BOX
shape {
    monitor =eDP-1
    size = 2560, 1600
    color = rgba(29, 32, 33, 0.6)
    rounding = 0
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor = HDMI-A-1
    size = 2560, 1440
    color = rgba(29, 32, 33, 0.6)
    rounding = 0
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false
    position = 0, 0
    halign = center
    valign = center
}
# Day
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A")"
    color = rgb(235, 219, 178)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 210
    halign = center
    valign = center
}
# Date-Month
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = rgb(235, 219, 178)
    font_size = 40
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 110
    halign = center
    valign = center
}
# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"- %I:%M -")</span>"
    color = rgb(235, 219, 178)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 50
    halign = center
    valign = center
}
# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = rgba(235, 219, 178,1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 0, -40
    halign = center
    valign = center
}
# USER
label {
    monitor =
    text = $USER
    color = rgb(29, 32, 33)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -40
    halign = center
    valign = center
}
# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(235, 219, 178, 0)
    inner_color = rgba(235, 219, 178,1)
    font_color = rgb(29, 32, 33)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font Bold
    placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}
# Reboot
label {
    monitor =
    text = 󰜉
    color = rgb(235, 219, 178)
    font_size = 50
    font_family = Symbols Nerd Font
    onclick = reboot
    position = 0, -230
    halign = center
    valign = center
}
# Power off
label {
    monitor =
    text = 󰐥
    color = rgb(235, 219, 178)
    font_size = 50
    font_family = Symbols Nerd Font
    onclick = shutdown now
    position = 150, -230
    halign =center
    valign = center
}
# Suspend
label {
    monitor =
    text = 󰤄
    color = rgb(235, 219, 178)
    font_size = 50
    font_family = Symbols Nerd Font
    onclick = systemctl suspend
    position = -150, -230
    halign = center
    valign = center
}

