# -----------------------------------------------------
# General window decoration
# name: "Rounding All Blur No Shadows"
# -----------------------------------------------------

decoration {
    rounding = 0
    active_opacity = 0.95
    inactive_opacity = 0.95
    fullscreen_opacity = 0.9

    blur {
        enabled = true
        size = 4
        passes = 4
        new_optimizations = on
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = true
        range = 10
        render_power = 1
        color = rgba(00000050)
        color_inactive = rgba(00000000)
    }
}
layerrule = blur on, match:namespace waybar
