# -----------------------------------------------------
# General window layout and colors
# name: "Default"
# -----------------------------------------------------

general {
    gaps_in = -1
    gaps_out = 0
    border_size = 2
    col.active_border = rgba(235,219,178,1)
    col.inactive_border = rgba(29,32,33,1)
    layout = dwindle
    resize_on_border = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
orientation = center
mfact = 0.4
}

gesture = 3, horizontal, workspace


binds {
  workspace_back_and_forth = false
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
}

group {
    col.border_active = rgba(235,219,178,1)
    col.border_inactive =rgba(29,32,33,1)
    col.border_locked_active = rgba(235,219,178,1)
    col.border_locked_inactive = rgba(29,32,33,1)
    
    groupbar {
        enabled = true
        font_family = JetBrainsMono Nerd Font
        font_weight_active = bold
        font_weight_inactive = bold
        font_size = 15
        text_offset = 1
        gradients = true
        height = 25
        priority = 3
        render_titles = true
        scrolling = true
        indicator_height = 0
        indicator_gap = 0
        rounding_power = 0
        gaps_out = 0
        gaps_in = -1
        text_color = rgb(282828)
        text_color_inactive = rgb(665c54)
        col.active = rgb(ebdbb2)
        col.inactive =rgb(282828)
        col.locked_active = rgb(689d6a)
        col.locked_inactive = rgb(282828)
    }
}
