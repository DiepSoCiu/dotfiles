# Start Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Load Wallpaper
exec-once = waypaper --restore

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# load wifi auto
exec-once = ~/.config/rofi/network/daemon.sh

#waybar
exec-once = waybar

# typing method
exec-once = fcitx5 -d
