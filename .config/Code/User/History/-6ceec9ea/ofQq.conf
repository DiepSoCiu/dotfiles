layerrule = blur on, xray on, match:namespace rofi

windowrule {
  name = float-signin
  match:title = Đăng nhập - Tài khoản Google — Zen Browser
  float = on
  center = on
  size = 700 500
}

windowrule {
  name = float-input_1
  match:class = nwg-look
  float = on
  center = on
  size = 1000 500
  xray = on
}

windowrule {
  name = float-input_2
  match:class = xdg-desktop-portal-gtk
  float = on
  center = on
  size = 1000 500
  xray = on
}

windowrule {
  name = float-sioyek
  match:class = sioyek
  float = off
}

windowrule {
  name = tile-geogebra
  match:class = org-geogebra-desktop-GeoGebra3D
  tile = on
}

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}
