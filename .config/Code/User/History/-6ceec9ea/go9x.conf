layerrule = blur on, xray on, match:namespace rofi

windowrule {
  name = float-signin
  match:title = Đăng nhập - Tài khoản Google — Zen Browser
  float = on
  center = on
  size = 700 500
}

windowrule {
  name = float-input
  match:class = xdg-desktop-portal-gtk
  float = on
  center = on
  size = 1000 500
  decoration {
    rounding = 0
    active_opacity = 0.95
    inactive_opacity = 0.95
    fullscreen_opacity = 0.9

    blur {
        enabled = true
        size = 4
        passes = 4
        new_optimizations = on
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = true
        range = 10
        render_power = 1
        color = rgba(00000050)
        color_inactive = rgba(00000000)
    }
}
}
