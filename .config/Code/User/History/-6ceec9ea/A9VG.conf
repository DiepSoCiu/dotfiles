layerrule = blur on, xray on, match:namespace rofi

windowrule {
  name = float-signin
  match:title = Đăng nhập - Tài khoản Google — Zen Browser
  float = on
  center = on
  size = 700 500
}

windowrule {
  name = float-input
  match:class = xdg-desktop-portal-gtk
  float = on
  center = on
  size = 1000 500
  
}
